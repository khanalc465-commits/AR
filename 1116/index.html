
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Avatar Switcher</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-vr-kit@v0.2.0/vr-kit.js"></script>

  <style>
    #hub {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 999;
      padding: 12px;
    }

    select {
      font-size: 18px;
      padding: 4px 8px;
      width: 200px;
    }
  </style>
</head>

<body>

  <div id="hub">
    <select id="avatarChoice">
      <option value="robot.glb">Robot</option>
      <option value="wolf.glb">Wolf</option>
    </select>
  </div>

  <a-scene>
    <a-sky color="lightblue"></a-sky>

    <a-plane
      rotation="-90 0 0"
      width="30"
      height="30"
      color="darkseagreen">
    </a-plane>

    <a-entity
      id="avatar"
      gltf-model="robot.glb"
      position="0 0 -3"
      scale="0.3 0.3 0.3"
      avatar="
        view: third;
        avatarDirection: 180;
        walk: Robot_walking;
        idle: Robot_wave;
        cameraOffset: 0 1.3 1;
      ">
    </a-entity>

    <a-box color="gold" position="0 2 -5"></a-box>

  </a-scene>

  <script>
    const avatar = document.getElementById("avatar");
    const avatarChoice = document.getElementById("avatarChoice");

    function changeAvatar() {

      if (avatarChoice.value === "wolf.glb") {

        avatar.setAttribute("gltf-model", "wolf.glb");
        avatar.setAttribute("scale", "0.5 0.5 0.5");

        avatar.setAttribute("avatar-motion", {
          walk: "Gallop",
          idle: "idle"
        });

      }

      if (avatarChoice.value === "robot.glb") {

        avatar.setAttribute("gltf-model", "robot.glb");
        avatar.setAttribute("scale", "0.3 0.3 0.3");

        avatar.setAttribute("avatar-motion", {
          walk: "Robot_walking",
          idle: "Robot_wave"
        });

      }
    }

    avatarChoice.addEventListener("change", changeAvatar);

  </script>

</body>
</html>

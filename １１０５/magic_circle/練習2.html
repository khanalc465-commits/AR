
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Video Player</title>

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-gesture-hands@v0.9.2/aframe-gesture-hands.js"></script>
  </head>

  <body>
    <a-scene id="scene" hands>

      <a-assets>
        <video
          id="video"
          src="../player/sky.mp4"
          preload="auto"
          playsinline
          muted
        ></video>
      </a-assets>
      <a-video
        src="#video"
        opacity="0.8"
        width="3.2"
        height="1.8"
        rotatio="-10 0 0"
        position="0 0.5 -2"
      ></a-video>
      <a-plane
        id="play-button"
        color="green"
        width="0.8"
        height="0.4"
        position="-0.6 -0.8 -2"
      >
        <a-text
          value="PLAY"
          align="center"
          color="white"
          width="3"
          position="0 0 0.01"
        ></a-text>
      </a-plane>
      <a-plane
        id="stop-button"
        color="red"
        width="0.8"
        height="0.4"
        position="0.6 -0.8 -2"
      >
        <a-text
          value="STOP"
          align="center"
          color="white"
          width="3"
          position="0 0 0.01"
        ></a-text>
      </a-plane>

      <a-camera position="0 0 0"></a-camera>

    </a-scene>

    <script>
      const scene = document.getElementById("scene");
      const video = document.getElementById("video");

      const playButton = document.getElementById("play-button");
      const stopButton = document.getElementById("stop-button");

      let wasPlayInside = false;
      let wasStopInside = false;

      function controlVideo() {

        const hands = scene.components.hands;

        if (!hands) return;

        const playInside = hands.isPointOnEntity(8, playButton);

        if (playInside && !wasPlayInside) {
          video.play();
        }

        wasPlayInside = playInside;


        const stopInside = hands.isPointOnEntity(8, stopButton);

        if (stopInside && !wasStopInside) {
          video.pause();
          video.currentTime = 0;
        }

        wasStopInside = stopInside;
      }

      scene.addEventListener("hand-result", controlVideo);

    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-gesture-hands@v0.9.2/aframe-gesture-hands.js"></script>
  </head>
  <body>
    <a-scene hands>
        <a-entity hand-skeleton="
        points:true;
        lines:true;
        numbers:true;
        color:gold;
        "
        >
        </a-entity>
        <a-entity hand-anchor="index:4">
            <a-octahedron
            color="gold"
            scale="0.1 0.1 0.1"
            position="0 0.2 0"
            ></a-octahedron>
        </a-entity>
        <a-entity hand-anchor="index:8">
            <a-octahedron
            color="black"
            scale="0.1 0.1 0.1"
            position="0 0.2 0"
            ></a-octahedron>
        </a-entity>
        <a-entity hand-anchor="index:12">
            <a-octahedron
            color="pink"
            scale="0.1 0.1 0.1"
            position="0 0.2 0"
            ></a-octahedron>
        </a-entity>
        <a-entity hand-anchor="index:16">
            <a-octahedron
            color="silver"
            scale="0.1 0.1 0.1"
            position="0 0.2 0"
            size="1px"
            ></a-octahedron>
        </a-entity>
        <a-entity hand-anchor="index:20">
            <a-octahedron
            color="green"
            scale="0.1 0.1 0.1"
            position="0 0.2 0"
            ></a-octahedron>
        </a-entity>
        <a-entity hand-anchor="index:9">
           <a-gltf-model
           id="circle"
           src="c_rose.glb"
           animation-mixer="clip:MagicCircle_loop"
           position="0 1 0"
           rotation="-90 0 0"
           scale="2 2 2"
           ></a-gltf-model>
        </a-entity>


        
    </a-scene>
  </body>
</html>

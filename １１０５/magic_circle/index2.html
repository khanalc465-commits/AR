<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
 
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-gesture-hands@v0.9.2/aframe-gesture-hands.js"></script>
 
    <style>
      #hud {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 99999;
        display: flex;
        gap: 10px;
        pointer-events: auto;
      }
 
      button {
        font-size: 18px;
        padding: 10px 20px;
        cursor: pointer;
        pointer-events: auto;
      }
    </style>
  </head>
 
  <body>
    <div id="hud">
      <button id="circle1Btn">Btn1</button>
      <button id="circle2Btn">Btn2</button>
    </div>
 
    <a-scene hands>
      <a-entity
        hand-skeleton="
        points:true;
        lines:true;
        numbers:true;
        color:gold;
      "
      ></a-entity>
 
      <a-entity hand-anchor="index:9">
        <a-gltf-model
          id="circle"
          src="c_cyan.glb"
          animation-mixer="clip: MagicCircle_Loop"
          position="0 1 0"
          scale="2 2 2"
        ></a-gltf-model>
      </a-entity>
    </a-scene>
 
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const circle1Btn = document.getElementById("circle1Btn");
        const circle2Btn = document.getElementById("circle2Btn");
 
        const circle = document.getElementById("circle");
 
        const circleSound = new Audio("circle.mp3");
 
        function changeCircle(modelPath) {
          console.log("Mengganti model:", modelPath);
 
          circle.setAttribute("src", modelPath);
 
          circleSound.currentTime = 0;
 
          circleSound.play().catch((error) => {
            console.warn("Audio tidak dapat diputar:", error);
          });
        }
 
        circle1Btn.addEventListener("click", function () {
          changeCircle("c_rose.glb");
        });
 
        circle2Btn.addEventListener("click", function () {
          changeCircle("c_gold.glb");
        });
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AR Snowman and Tree</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden">
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
<!-- Hiro Marker -->
<a-marker preset="kanji">

    <!-- SNOWMAN: LEFT -->
    <a-entity
    id="snowman"
    position="-0.7 0.45 0"
    rotation="0 0 90"
    scale="0.3 0.3 0.3">

        <a-sphere position="0 1 0" radius="1" color="white"></a-sphere>
        <a-sphere position="0 2.4 0" radius="0.7" color="white"></a-sphere>

        <!-- Blue hat -->
        <a-cone
            position="0 3.5 0"
            color="skyblue"
            radius-bottom="0.8"
            radius-top="0"
            height="1.5">
        </a-cone>

        <!-- Eyes -->
        <a-sphere position="-0.3 2.5 0.65" radius="0.08" color="black"></a-sphere>
        <a-sphere position="0.3 2.5 0.65" radius="0.08" color="black"></a-sphere>

        <!-- Orange nose -->
        <a-cone
            position="0 2.3 0.75"
            rotation="90 0 0"
            color="orange"
            radius-bottom="0.1"
            radius-top="0"
            height="0.35">
        </a-cone>

        <!-- Buttons -->
        <a-sphere position="0 1.8 0.9" radius="0.08" color="black"></a-sphere>
        <a-sphere position="0 1.5 0.95" radius="0.08" color="black"></a-sphere>
        <a-sphere position="0 1.2 0.95" radius="0.08" color="black"></a-sphere>
    </a-entity>

    <!-- TREE: RIGHT -->
    <a-entity
    id="tree"
    position="0.8 0.5 0"
    rotation="0 0 90"
    scale="0.4 0.4 0.4">

        <a-cylinder
            position="0 1 0"
            radius="0.3"
            height="2"
            color="#79502b">
        </a-cylinder>

        <a-sphere
            position="0 2.5 0"
            radius="1.2"
            color="#28a745">
        </a-sphere>

        <a-sphere
            position="-0.7 2.3 0"
            radius="0.8"
            color="#176b32">
        </a-sphere>

        <a-sphere
            position="0.7 2.3 0"
            radius="0.8"
            color="#176b32">
        </a-sphere>
    </a-entity>

</a-marker>


      <!-- AR Camera -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>

<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

    <style>
        #hub{
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
        }
        button{
            font-size: 20px;
            padding: 12px 20px;
            border: none;
            background-color: royalblue;
            color: white;
            border-radius: 10px;
            margin-right: 10px;
        }
    </style>

</head>

<body>
    <div id="hub">
        <select name="" id="">
            <option value="RobotArmature|Robot_Walking">ある</option>
            <option value="RobotArmature|Robot_Dance">おどる</option>
            <option value="RobotArmature|Robot_death">死ぬ</option>
            <option value="RobotArmature|Robot_jump">ジャンプ</option>
            <option value="RobotArmature|Robot_punch">パンチ</option>
        </select>
    </div>
    <a-scene embedded arjs="sourceType: webcam">

        <a-marker preset="hiro" smooth="true">
            <a-gltf-model 
            id="robot" 
            src="robot.glb" 
            position="0 0 0.5" 
            scale="0.3 0.3 0.3" 
            rotation="-90 0 0"
            animation-mixer="clip: RobotArmature|Robot_Dance">
            </a-gltf-model>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

    <script>
        const robot = document.getElementById("robot");
        const walkButton=document.getElementById("walkButton")
        const danceButton = document.getElementById("danceButton")
        const deathButton = document.getElementById("deathButton")
        const jumpButton = document.getElementById("jumpButton")
        const punchButton = document.getElementById("punchButton")
        

        function walkAnimation(){
            robot.setAttribute("animation-mixer","clip","RobotArmature|Robot_Walking")
        }

        function danceAnimation(){
          robot.setAttribute("animation-mixer","clip","RobotArmature|Robot_Dance")
        }

        function deathAnimation(){
            robot.setAttribute("animation-mixer","clip","RobotArmature|Robot_death")
        }

        function jumpAnimation(){
            robot.setAttribute("animation-mixer","clip","RobotArmature|Robot_jump")
        }

        function punchAnimation(){
            robot.setAttribute("animation-mixer","clip","RobotArmature|Robot_punch")
        }

        walkButton.addEventListener("click",walkAnimation);
        danceButton.addEventListener("click",danceAnimation);
        deathButton.addEventListener("click", deathAnimation);
        jumpButton.addEventListener("click", jumpAnimation);
        punchButton.addEventListener("click", punchAnimation);

    </script>
</body>

</html>

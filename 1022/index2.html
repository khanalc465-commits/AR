<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
 
    <style>
      #hud {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 999;
      }
 
      button {
        font-size: 20px;
        padding: 12px 20px;
        border: none;
        background-color: royalblue;
        color: white;
        border-radius: 10px;
        margin-right: 10px;
        cursor: pointer;
      }
 
      select {
        font-size: 18px;
        padding: 10px 12px;
        border-radius: 8px;
      }
    </style>
  </head>
 
  <body>
    <div id="hud">
      <select id="animationSelect">
        <option value="RobotArmature|Robot_Walking">あるく</option>
        <option value="RobotArmature|Robot_Dance">おどる</option>
        <option value="RobotArmature|Robot_Punch">パンチ</option>
      </select>
      <button id="enlargeButton">拡大</button>
      <button id="shrinkButton">縮小</button>
      <button id="rotateButton">回転</button>
      <button id="reverseButton">逆回転</button>
    </div>
 
    ```html
<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true"
  arjs="sourceType: webcam; debugUIEnabled: true;">

  <a-marker
    preset="hiro"
    smooth="true">

    <!-- Test marker detection first -->
    <a-box
      position="0 0.5 0"
      material="color: red;">
    </a-box>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>
```

 
    <script>
      const robot = document.getElementById("robot");
      const animationSelect = document.getElementById("animationSelect");
 
      const model = document.getElementById("model");
      const enlargeButton = document.getElementById("enlargeButton");
      const shrinkButton = document.getElementById("shrinkButton");
      const rotateButton = document.getElementById("rotateButton");
      const reverseButton = document.getElementById("reverseButton");
 
      let size = 1;
 
      function enlargeModel() {
        size = size + 0.1;
        model.setAttribute("scale", `${size} ${size} ${size}`);
      }
 
      enlargeButton.addEventListener("click", enlargeModel);
 
      function shrinkModel() {
        size = size + -0.1;
        model.setAttribute("scale", `${size} ${size} ${size}`);
      }
 
      shrinkButton.addEventListener("click", shrinkModel);
 
      let angle = 0;
 
      function rotateModel() {
        angle += 15;
        model.setAttribute("rotation", `0 0 ${angle}`);
      }
 
      rotateButton.addEventListener("click", rotateModel);
 
      function reverveModel() {
        angle -= 15;
        model.setAttribute("rotation", `0 0 ${angle}`);
      }
 
      reverseButton.addEventListener("click", reverveModel);
 
      function changeAnimation() {
        robot.setAttribute("animation-mixer", {
          clip: animationSelect.value,
        });
      }
 
      animationSelect.addEventListener("change", changeAnimation);
 
      const walkButton = document.getElementById("walkButton");
      const danceButton = document.getElementById("danceButton");
      const punchButton = document.getElementById("punchButton");
 
      function walkAnimation() {
        robot.setAttribute(
          "animation-mixer",
          "clip",
          "RobotArmature|Robot_Walking",
        );
      }
 
      function danceAnimation() {
        robot.setAttribute(
          "animation-mixer",
          "clip",
          "RobotArmature|Robot_Dance",
        );
      }
 
      function punchAnimation() {
        robot.setAttribute(
          "animation-mixer",
          "clip",
          "RobotArmature|Robot_Punch",
        );
      }
    </script>
  </body>
</html>

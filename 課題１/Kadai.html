<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Woman Animation</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

    <!-- Animation Mixer -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      #hud {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 999;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        max-width: calc(100vw - 40px);
      }

      button {
        font-size: 16px;
        padding: 10px 14px;
        border: none;
        background-color: royalblue;
        color: white;
        border-radius: 8px;
        cursor: pointer;
      }

      button:active {
        background-color: navy;
      }

      select {
        font-size: 16px;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
        background-color: white;
        max-width: 100%;
      }
    </style>
  </head>

  <body>
    <!-- Control Panel -->
    <div id="hud">
      <select id="animationSelect">
        <option value="Armature|Idle">待機 (Idle)</option>
        <option value="Armature|Walking">歩く (Walking)</option>
        <option value="Armature|Running">走る (Running)</option>
        <option value="Armature|Jump">ジャンプ (Jump)</option>
        <option value="Armature|Jump2">ジャンプ2 (Jump2)</option>
        <option value="Armature|Punch">パンチ (Punch)</option>
        <option value="Armature|PickUp">拾う (PickUp)</option>
        <option value="Armature|Sitting">座る (Sitting)</option>
        <option value="Armature|SitIdle">座って待機 (SitIdle)</option>
        <option value="Armature|Death">倒れる (Death)</option>
      </select>

      <button id="enlargeButton">拡大</button>
      <button id="shrinkButton">縮小</button>
      <button id="rotateButton">回転</button>
      <button id="reverseButton">逆回転</button>
    </div>
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="colorManagement: true"
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <a-marker
        preset="hiro"
        smooth="true"
        smoothCount="5"
        smoothTolerance="0.01"
        smoothThreshold="2"
      >
        <a-entity
          id="model"
          position="0 0 0.5"
          rotation="0 0 0"
          scale="1 1 1"
        >
          <a-gltf-model
            id="Women"
            src="Woman.glb"
            position="0 0 0"
            scale="0.3 0.3 0.3"
            rotation="-90 0 0"
            animation-mixer="clip: Armature|Idle; loop: repeat"
          ></a-gltf-model>
        </a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
    <script>
      const Anne = document.getElementById("Women");
      const animationSelect = document.getElementById("animationSelect");
      const model = document.getElementById("model");
      const enlargeButton = document.getElementById("enlargeButton");
      const shrinkButton = document.getElementById("shrinkButton");
      const rotateButton = document.getElementById("rotateButton");
      const reverseButton = document.getElementById("reverseButton");
      let size = 1;
      function enlargeModel() {
        size += 0.1;
        model.setAttribute("scale", `${size} ${size} ${size}`);
      }
      enlargeButton.addEventListener("click", enlargeModel);
      function shrinkModel() {
        size = Math.max(0.1, size - 0.1);
        model.setAttribute("scale", `${size} ${size} ${size}`);
      }
      shrinkButton.addEventListener("click", shrinkModel);
      let angle = 0;
      function rotateModel() {
        angle += 15;
        model.setAttribute("rotation", `0 ${angle} 0`);
      }

      rotateButton.addEventListener("click", rotateModel);

      function reverseModel() {
        angle -= 15;
        model.setAttribute("rotation", `0 ${angle} 0`);
      }

      reverseButton.addEventListener("click", reverseModel);
      const oneTimeAnimations = [
        "Armature|Death",
        "Armature|Jump",
        "Armature|Jump2",
        "Armature|PickUp",
        "Armature|Punch",
      ];
      function changeAnimation() {
        const selectedAnimation = animationSelect.value;

        Anne.setAttribute("animation-mixer", {
          clip: selectedAnimation,
          loop: oneTimeAnimations.includes(selectedAnimation)
            ? "once"
            : "repeat",
          clampWhenFinished: true,
        });
      }
      animationSelect.addEventListener("change", changeAnimation);
      Anne.addEventListener("model-loaded", function () {
        changeAnimation();
        console.log("Woman.glb loaded successfully");
      });
      Anne.addEventListener("model-error", function (event) {
        console.error("Failed to load Woman.glb:", event);
      });
    </script>
  </body>
</html>
